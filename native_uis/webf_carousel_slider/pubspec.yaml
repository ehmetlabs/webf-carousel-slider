name: webf_carousel_slider
description: WebF Custom Element wrapper for carousel_slider_plus. Provides hybrid UI carousel component with Flutter performance and JavaScript API.
version: 1.0.1
homepage: https://github.com/example/carousel-slider-webf
repository: https://github.com/example/carousel-slider-webf
issue_tracker: https://github.com/example/carousel-slider-webf/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  webf: ^0.24.1
  carousel_slider_plus: ^7.1.1
  logger: ^2.6.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.1
  integration_test:
    sdk: flutter

