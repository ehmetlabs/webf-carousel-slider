<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebF Carousel Slider Example</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f7;
      color: #1f1f1f;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 20px;
      font-weight: 600;
    }

    webf-carousel-slider {
      display: block;
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      background: #e6e6ea;
    }

    webf-carousel-slider-item {
      width: 100%;
      height: 220px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #d0d0d4;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WebF Carousel Slider</h1>

    <webf-carousel-slider
      id="carousel"
      auto-play
      auto-play-interval="3000"
      auto-play-animation-duration="300"
      enable-infinite-scroll
    >
      <webf-carousel-slider-item image-url="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=450&fit=crop"></webf-carousel-slider-item>
      <webf-carousel-slider-item image-url="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&h=450&fit=crop"></webf-carousel-slider-item>
      <webf-carousel-slider-item image-url="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&h=450&fit=crop"></webf-carousel-slider-item>
    </webf-carousel-slider>

    <div class="controls">
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
      <button id="pauseBtn">Pause</button>
      <button id="playBtn">Play</button>
    </div>

    <div class="status" id="status">Ready</div>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const statusEl = document.getElementById('status');

    const updateStatus = (text) => {
      statusEl.textContent = text;
    };

    carousel.onPageChanged = (index, reason) => {
      updateStatus(`index: ${index}, reason: ${reason}, realPage: ${carousel.realPage}`);
    };

    carousel.onScrolled = (value) => {
      if (value !== null && value !== undefined) {
        console.log('scrolled:', value);
      }
    };

    document.getElementById('prevBtn').addEventListener('click', () => {
      carousel.previousPage();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      carousel.nextPage();
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      carousel.stopAutoPlay();
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      carousel.startAutoPlay();
    });

    updateStatus(`slides: ${carousel.children.length}`);
  </script>
</body>
</html>
